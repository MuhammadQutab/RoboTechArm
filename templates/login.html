<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        /* General reset and responsive styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: url('/static/images/image2.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            overflow: hidden;
        }

        /* Card container */
        .container {
            display: flex;
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85); /* Slight transparency */
            border-radius: 12px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        /* Left side - Form section */
        .form-section {
            width: 50%;
            padding: 40px;
            text-align: center;
            background: linear-gradient(135deg, #4a90e2, #9013fe);
            color: #fff;
        }

        .form-section h2 {
            font-size: 2.5em;
            margin-bottom: 5px;
        }

        .input-group {
            display: flex;
            align-items: center;
            margin: 10px 0;
            border-radius: 8px;
            background: #fff;
            padding: 10px;
            border: 1px solid #ddd;
        }

        .input-group i {
            margin-right: 10px;
            color: #4a90e2;
        }

        .input-group input {
            border: none;
            outline: none;
            font-size: 1.2em;
            flex: 1;
            padding: 10px;
        }

        .form-section .password-container {
            position: relative;
            width: 100%;
        }

        .form-section .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #4a90e2;
        }

        .form-section button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1.2em;
            color: #fff;
            background-color: #00c853;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .form-section button:hover {
            background-color: #00a944;
            transform: scale(1.05);
        }

        .signup {
            margin-top: 20px;
            font-size: 1.1em;
            color: #fff;
            text-decoration: underline;
            cursor: pointer;
        }

        /* Right side - Illustration section */
        .illustration-section {
            width: 50%;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            overflow: hidden;
        }

        .illustration {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .form-section, .illustration-section {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Login Form Container -->
    <div class="container">
        <div class="form-section">
            <h2>WELCOME</h2>
            <form action="{{ url_for('login') }}" method="POST">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="email" name="email" placeholder="Username" required>
                </div>
                <div class="input-group password-container">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" placeholder="Password" required>
                    <i class="fas fa-eye toggle-password"></i>
                </div>
                <button type="submit">SUBMIT</button>
                <div class="signup">Don't have an account? <a href="{{ url_for('signup') }}">Sign Up</a></div>
            </form>
        </div>
        <div class="illustration-section">
            <img src="/static/images/view-robot-taking-care-garden.jpg" alt="Illustration" class="illustration">
        </div>
    </div>

    <!-- Password toggle script -->
    <script>
        const togglePassword = document.querySelector('.toggle-password');
        const passwordInput = document.querySelector('input[name="password"]');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            togglePassword.classList.toggle('fa-eye-slash');
        });
    </script>

    <!-- Font Awesome for icons -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</body>
</html>
